<!doctype html>
<html lang="en">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="theme-color" content="#090e13" />
            <title>You're offline | MTStreams</title>
            <style>
                  * { box-sizing: border-box; }
                  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #090e13; color: #f4f7f8; font-family: Segoe UI, Arial, sans-serif; text-align: center; }
                  main { width: min(100%, 440px); padding: 42px 32px; border: 1px solid #293b43; border-radius: 22px; background: #101a20; box-shadow: 0 24px 80px #0008; }
                  .mark { display: inline-grid; place-items: center; width: 60px; height: 60px; border-radius: 17px; background: #75d8c6; color: #09201f; font-size: 23px; font-weight: 900; letter-spacing: -2px; }
                  h1 { margin: 22px 0 10px; font-size: 27px; }
                  p { margin: 0; color: #a9bac0; line-height: 1.65; }
            </style>
      </head>
      <body>
            <main>
                  <span class="mark">MT</span>
                  <h1>You're offline</h1>
                  <p>MTStreams needs an internet connection to load movie and series information. Reconnect and try again.</p>
            </main>
      </body>
</html>
